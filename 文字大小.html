<html>
  <head><title>文字顏色</title></head>
      <style>
        .f1{ font-size:large; }
        .f2{ font-size:20px; }
        .f3{ font-size:2em; }
      </style>
      <!-- 固定的大小,可細微調整,自適應排版 -->
  </head>
  <body>
    <p>hi</p>
    <p class='f1'>大</p>
    <p class='f2'>px</p>
    <p class='f3'>em</p>
  </body>
</html>
